name: Tesla Charge calculation rules
on:
  push:
    paths: ['scripts/tesla-charge/**', '.github/workflows/tesla-charge-tests.yml']
  pull_request:
    paths: ['scripts/tesla-charge/**', '.github/workflows/tesla-charge-tests.yml']
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/tesla-charge/tests/*.test.js
